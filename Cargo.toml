[package]
name = "md-snapshot"
version = "0.2.0"
edition = "2024"
authors = ["AmiiirCom"]
description = "Fast, token-optimized desktop app to pack codebases and docs into clean LLM context"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
egui = "0.29"
rfd = "0.15"
walkdir = "2.5"
ignore = "0.4"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[build-dependencies]
winres = "0.1"